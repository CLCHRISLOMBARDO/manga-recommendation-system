<!DOCTYPE html>
<html lang="es" data-theme="cupcake">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <title>Ingreso - Manga Recommender</title>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">
    
    <div class="card w-full max-w-sm bg-base-100 shadow-2xl">
        <div class="card-body">
            <h2 class="card-title text-2xl font-bold justify-center mb-2">📚 Mi Manga App</h2>
            <p class="text-center text-sm text-base-content/70 mb-6">Ingresa tu usuario para recibir recomendaciones personalizadas</p>
            
            <form method="post" action="/">
                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text font-semibold">Usuario de lectura</span>
                    </label>
                    <input type="text" name="id_lector" placeholder="Ej: naruto_fan99" minlength="5" maxlength="30" required class="input input-bordered w-full focus:input-primary" />
                </div>
                
                <div class="card-actions mt-6">
                    <button type="submit" class="btn btn-primary w-full text-lg shadow-sm">Entrar al sistema</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
